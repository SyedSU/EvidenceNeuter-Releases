name: Publish reviewed signed metadata
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full reviewed source commit in this repository
        required: true
      immutable_tag:
        description: Existing immutable release tag (renewal does not modify packages)
        required: true
      envelope_path:
        description: Reviewed signed metadata JSON path in repository
        required: true
      hub_envelope_path:
        description: Reviewed signed Hub envelope JSON (mandatory for public catalog)
        required: false
      genesis_envelope_path:
        description: Reviewed signed Genesis envelope JSON (mandatory for public catalog)
        required: false
      hub_manifest_url:
        description: Reviewed published Hub manifest locator matching catalog
        required: false
      genesis_manifest_url:
        description: Reviewed published Genesis manifest locator matching catalog
        required: false
      kind:
        type: choice
        options: [catalog, manifest, hub]
        required: true
permissions:
  contents: read
concurrency:
  group: reviewed-metadata-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind publication to this immutable main workflow commit
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          sha=os.environ['REVIEWED_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}',sha) or sha!=os.environ['WORKFLOW_COMMIT'] or subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=sha:raise SystemExit('Reviewed commit must equal this main workflow commit')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate candidate and immutable inputs
        env:
          COMMIT: ${{ inputs.reviewed_commit }}
          TAG: ${{ inputs.immutable_tag }}
          FILE: ${{ inputs.envelope_path }}
          KIND: ${{ inputs.kind }}
          PUBLIC_KEY: ${{ vars.DISTRIBUTION_PUBLIC_KEY_PEM }}
          CATALOG_SEQUENCE_FLOOR: ${{ vars.CATALOG_SEQUENCE_FLOOR }}
          HUB_SEQUENCE_FLOOR: ${{ vars.HUB_SEQUENCE_FLOOR }}
          GENESIS_SEQUENCE_FLOOR: ${{ vars.GENESIS_SEQUENCE_FLOOR }}
          HUB_PUBLIC_KEY: ${{ vars.HUB_MANIFEST_PUBLIC_KEY_PEM }}
          GENESIS_PUBLIC_KEY: ${{ vars.GENESIS_MANIFEST_PUBLIC_KEY_PEM }}
          PUBLISHER_PIN: ${{ vars.HUB_PUBLISHER_SHA256 }}
          HUB_FILE: ${{ inputs.hub_envelope_path }}
          GENESIS_FILE: ${{ inputs.genesis_envelope_path }}
          HUB_URL: ${{ inputs.hub_manifest_url }}
          GENESIS_URL: ${{ inputs.genesis_manifest_url }}
        run: |
          python tools/review_candidate.py
      - name: Require existing protected release environment (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/environment_preflight.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: distribution-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck the immutable main workflow commit before loading release tools
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          sha=os.environ['REVIEWED_COMMIT']
          if not re.fullmatch('[a-f0-9]{40}',sha) or sha!=os.environ['WORKFLOW_COMMIT'] or subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=sha:raise SystemExit('Reviewed commit must equal this main workflow commit')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Recheck environment protection after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/environment_preflight.py
      - name: Validate candidate and immutable inputs
        env:
          COMMIT: ${{ inputs.reviewed_commit }}
          TAG: ${{ inputs.immutable_tag }}
          FILE: ${{ inputs.envelope_path }}
          KIND: ${{ inputs.kind }}
          PUBLIC_KEY: ${{ vars.DISTRIBUTION_PUBLIC_KEY_PEM }}
          CATALOG_SEQUENCE_FLOOR: ${{ vars.CATALOG_SEQUENCE_FLOOR }}
          HUB_SEQUENCE_FLOOR: ${{ vars.HUB_SEQUENCE_FLOOR }}
          GENESIS_SEQUENCE_FLOOR: ${{ vars.GENESIS_SEQUENCE_FLOOR }}
          HUB_PUBLIC_KEY: ${{ vars.HUB_MANIFEST_PUBLIC_KEY_PEM }}
          GENESIS_PUBLIC_KEY: ${{ vars.GENESIS_MANIFEST_PUBLIC_KEY_PEM }}
          PUBLISHER_PIN: ${{ vars.HUB_PUBLISHER_SHA256 }}
          HUB_FILE: ${{ inputs.hub_envelope_path }}
          GENESIS_FILE: ${{ inputs.genesis_envelope_path }}
          HUB_URL: ${{ inputs.hub_manifest_url }}
          GENESIS_URL: ${{ inputs.genesis_manifest_url }}
        run: |
          python tools/review_candidate.py
      - name: Publish reviewed metadata after protected human approval
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_WRITE_TOKEN }}
          TAG: ${{ inputs.immutable_tag }}
          FILE: ${{ inputs.envelope_path }}
        run: |
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          tag=os.environ['TAG']; path=Path(os.environ['FILE'])
          if not re.fullmatch('[A-Za-z0-9][A-Za-z0-9._-]{0,100}',tag) or not path.is_file() or path.is_absolute() or '..' in path.parts:raise SystemExit('Invalid reviewed inputs')
          # Existing release only; no release creation, executable upload or clobber.
          subprocess.run(['gh','release','view',tag,'--repo','SyedSU/EvidenceNeuter-Releases'],check=True)
          subprocess.run(['gh','release','upload',tag,str(path),'--repo','SyedSU/EvidenceNeuter-Releases'],check=True)
          PY
